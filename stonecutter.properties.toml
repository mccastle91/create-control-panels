mod.id = "create_controlling"
mod.name = "Create Controlling"
mod.group = "dev.mccastle91.createcontrolling"
mod.version = "0.2.2"
mod.authors = "mccastle91"
mod.license = "MIT"

# Minimum Create both builds accept. 6.0.8 is the newest release published for
# both 1.20.1 and 1.21.1; shared code compiles against it on 1.20.1, so it can
# never depend on a newer-only Create API.
deps.create_min = "6.0.8"

[forge."1.20.1"]
mod.mc_compat = "[1.20.1]"
deps.forge = "47.4.28"
# Companion versions match what Create's 1.20.1 6.0.8 release jar bundles
deps.create = "6.0.8-291"
deps.ponder = "1.0.91"
deps.flywheel = "1.0.5"
deps.registrate = "MC1.20-1.3.3"
deps.mixinextras = "0.4.1"
# Optional: JEI drag-and-drop into frequency slots. Compiled against its API only
deps.jei = "15.74.0.234"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21.1,1.22)"
deps.neoforge = "21.1.265"
# Newest Create release for 1.21.1; companions match its bundled jars
deps.create = "6.0.10-281"
deps.ponder = "1.0.82"
deps.flywheel = "1.0.6"
deps.registrate = "MC1.21-1.3.0+67"
# Optional: JEI drag-and-drop into frequency slots. Compiled against its API only
deps.jei = "19.70.0.469"
