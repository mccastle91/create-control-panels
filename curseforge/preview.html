<div class="page" id="c"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>document.getElementById('c').innerHTML=marked.parse("![Create Controlling: control consoles for Create](images/header.png)\n\n**Your contraptions deserve a control room.** Create Controlling adds a sloped **Control Console** you can cover in chunky 3D buttons, switches, knobs, sliders, lamps, gauges and glowing nixie tubes. Every part talks over **Create's own Redstone Link frequencies**, so a console can start a train yard, throttle a mill, open a gate across the base, or tell you how full the tanks are, all without running a single line of redstone dust.\n\n**Requires [Create](https://www.curseforge.com/minecraft/mc-mods/create) 6.0.8 or newer** \u00b7 Minecraft 1.20.1 (Forge) and 1.21.1 (NeoForge)\n\n![Features](images/divider-features.png)\n\n- **One block, any angle.** A console is a single wedge you place on a floor, wall or ceiling. Tilt it anywhere from flat to 45\u00b0, with quick presets at 0\u00b0, 15\u00b0, 30\u00b0 and 45\u00b0.\n- **14 hands-on components.** Buttons, latching buttons, a big red button, toggle and guarded switches, knobs, sliders, lamps, needle gauges, bar meters, nixie readouts and labels. You click the real 3D part in the world, no menu in between.\n- **Wired with Redstone Links.** Give each part two frequency items, exactly like a Redstone Link. Outputs send a signal and inputs display one, with full 0\u201315 analog strength.\n- **Built in a designer, not a spreadsheet.** Sneak-use with an empty hand to open the Console Designer, then drag parts onto a 16\u00d716 face on a half-pixel grid.\n- **Parts cost parts.** Each component is paid for with items from your inventory and refunded when you remove it. There are no tiers to grind; a bigger control desk just needs more parts.\n- **Fits right into a Create base.** Re-dress a console in any Create casing, line consoles up into one long desk, read them through Engineer's Goggles, and learn the basics in a Ponder scene.\n\n![Components](images/divider-components.png)\n\n![The 13 component types with their signals and costs](images/components.png)\n\nSliders come in horizontal and vertical versions, which makes 14 types in all. **Out** parts send a signal on their frequency; **in** parts listen to one and show how strong it is. A knob or slider at 9 sends strength 9, and a nixie readout listening on that frequency shows `09`.\n\nA few details worth knowing:\n\n- **Guarded switches** are a toggle switch under a lid that flips up on brass hinge posts. They take three clicks: lift the lid, flip the switch, then close the lid again. They only send a signal while the switch is on, so nobody shuts down the reactor by accident.\n- **Knobs and sliders** jump to wherever you click. Sneak and scroll over one to nudge it up or down by 1.\n- **Bar meters** have an adjustable length, from 3 to 14 pixels, set per meter in the designer.\n- **Nixie readouts** are all-glass tubes with the digits floating inside, readable from both sides. On a wall console they face straight out from the wall.\n- **Labels** don't block clicks, so you can put a caption right next to the control it names.\n\n![Getting Started](images/divider-getting-started.png)\n\n![Craft, shape, design, link](images/steps.png)\n\n1. **Craft a Control Console** from three iron sheets above a transmitter, an andesite casing and a Redstone Link. Place it like a lever, on a floor, wall or ceiling.\n2. **Set the angle.** Sneak-use a wrench on any console to step through 0\u00b0, 15\u00b0, 30\u00b0 and 45\u00b0, or use the angle slider in the designer for anything in between. Floor and ceiling consoles slope towards you; wall consoles start flat and can tilt either way.\n3. **Open the designer** by sneak-using the console with an empty hand. Pick a component on the left (hover it to see what it costs), drag it into place, and click it to set its frequency and options.\n4. **Link it up.** Put a Redstone Link with the same two frequency items next to whatever you want to control or watch. Then just use the console: press, flip, turn, slide.\n\n![Casings & Blueprints](images/divider-casings.png)\n\n**Casings.** Right-click a console with an **Andesite, Brass, Copper or Train Casing**, or a **Block of Industrial Iron**, to re-dress its body. Consoles of the same shape, angle and casing placed side by side join into one continuous desk.\n\n**Blueprints.** Breaking a console keeps its design, so you can pick it up and move it. To build the same layout again, craft a **Console Blueprint** (two paper, lapis lazuli and a brass sheet). Use it on a console to copy the design, then on another console to paste it. Pasting only charges you for parts the new console doesn't already have, and refunds the rest.\n\n**Goggles.** Look at a console while wearing Engineer's Goggles to see its linked components, their frequencies and their current values.\n\n![Compatibility](images/divider-compatibility.png)\n\n| | Minecraft 1.20.1 | Minecraft 1.21.1 |\n|---|---|---|\n| Mod loader | Forge 47.4+ | NeoForge 21.1+ |\n| Create | 6.0.8 or newer | 6.0.8 or newer |\n| Install on | client and server | client and server |\n\n- Consoles use Create's own Redstone Link network, so they work with every Redstone Link, Linked Controller setup and contraption you already have.\n- **Fabric:** not supported yet. A port depends on Create for Fabric reaching these Minecraft versions.\n\n![FAQ](images/divider-faq.png)\n\n**How far does a console reach?**\nAs far as a Redstone Link does. Consoles join Create's link network, so the range and rules are Create's own.\n\n**Can I use it in creative?**\nYes. Components are free in creative mode, and parts placed there refund nothing when removed.\n\n**Can I tilt a wall console?**\nYes. A wall console starts flat and can tilt either way: with its top edge standing out (handy for consoles mounted high) or its bottom edge out, like a lectern. The sneak-wrench steps through 15\u00b0, 30\u00b0 and 45\u00b0 top edge out, then bottom edge out, then back to flat; in the designer, the **Top out / Bottom out** button picks the raised edge.\n\n**Is it in a modpack?**\nYou're welcome to include Create Controlling in any modpack.\n\n![Credits](images/divider-credits.png)\n\n- Built on and for **[Create](https://www.curseforge.com/minecraft/mc-mods/create)** by the Creators of Create.\n- The sloped-console idea is inspired by **Control Engineering** by malte0811, the Immersive Engineering addon. Create Controlling is its own mod, built from scratch for Create.\n- Banner art is hand-drawn illustration, not in-game screenshots. See the **Images** tab for how the mod really looks.\n\nFound a bug or have an idea? Please open an issue on the [issue tracker](https://github.com/mccastle91/create-control-panels/issues).\n\nLicensed under the MIT License.\n")</script>
